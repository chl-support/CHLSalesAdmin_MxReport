<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Laporan CHL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #ffffff; --ink: #0f2140; --text: #1c2533; --muted: #5d6878; --line: #dfe4ec;
  --navy: #0d2a57; --navy-2: #163a70; --blue: #2a6fc0; --blue-soft: #e8eef7;
  --green: #1f8a55; --gold: #c98a12; --red: #c0392b; --grey: #8a9893; --track: #f1f4f8;
  --input-bg: #fffbea; --on-navy: #ffffff;
  --side-bg: #f3f2ee; --side-ink: #1b1d22; --side-line: #dcdad3; --side-hover: #e8e6df; --side-active: #1c1d21;
  --gold: #c9971c; --gold-ink: #a87a0e;
  --green-soft: #e3f2ea; --gold-soft: #faf0dc; --red-soft: #f8e4e1; --grey-soft: #eef0f2;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1522; --ink: #e4ebf7; --text: #d5dce7; --muted: #95a1b3; --line: #253247;
    --navy: #0b2148; --navy-2: #15346a; --blue: #6aa6ec; --blue-soft: #18263d;
    --green: #4fc788; --gold: #e8b04a; --red: #ef7a6c; --grey: #7d8d87; --track: #172234;
    --input-bg: #1d2433; color-scheme: dark;
    --side-bg: #141a24; --side-ink: #e4e7ee; --side-line: #2a3343; --side-hover: #1d2533; --side-active: #2a3446;
    --gold: #e0b44a; --gold-ink: #e8c46a;
    --green-soft: #163628; --gold-soft: #3a2e15; --red-soft: #3b1f1d; --grey-soft: #1c2533;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }
.page { max-width: 1240px; margin: 0 auto; padding-bottom: 48px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* App bar */
.appbar { background: var(--navy); color: var(--on-navy); }
.appbar-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-weight: 800; letter-spacing: .02em; margin-right: auto; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 14px; opacity: .8; }
.nav a:hover { opacity: 1; background: rgba(255,255,255,.08); }
.nav a[aria-current="page"] { opacity: 1; background: var(--blue); }
.role { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.role select { background: var(--navy-2); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 4px 6px; }
.mockbar { background: var(--blue-soft); color: var(--ink); font-size: 12.5px; padding-block: 6px; display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }

/* Hero */
.hero { background: var(--navy); color: var(--on-navy); border-top: 1px solid rgba(255,255,255,.12); }
.tabs { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tab { background: var(--blue); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 22px; }
.hero-body { padding-block: 16px 18px; }
.hero h1 { margin: 0; font-size: clamp(24px, 4.6vw, 40px); font-weight: 800; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.hero .sub { margin-top: 10px; font-size: 16px; opacity: .9; }
.strip { background: var(--navy-2); color: #fff; padding-block: 10px; font-size: 15px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.strip-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-ghost { font-weight: 600; font-size: 13px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.btn-ghost:hover { background: rgba(255,255,255,.12); }
.strip select { background: var(--navy); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; padding: 4px 8px; font-size: 13px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; }
.kpi { border-left: 4px solid var(--c); padding: 6px 14px 10px; min-width: 0; }
.kpi .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font-size: 34px; font-weight: 800; color: var(--ink); line-height: 1.1; margin-top: 8px; }
.kpi .val small { font-size: 17px; font-weight: 600; color: var(--muted); }
.kpi .pct { font-size: 22px; font-weight: 700; color: var(--c); margin-top: 4px; }
.kpi .note { font-size: 13px; color: var(--muted); margin-top: 4px; }

section { margin-top: 30px; }
h2 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 800; text-transform: uppercase; }
.desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bars { margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 28%) 1fr auto auto; align-items: center; gap: 14px; padding-block: 6px; border-bottom: 1px solid var(--line); }
.bar-row .nm { font-weight: 700; color: var(--ink); }
.bar-row .track { height: 30px; background: var(--track); overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--c); position: relative; }
.bar-row .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255, 255, 255, 0), var(--bg)); opacity: .82; }
.bar-row .u { font-weight: 700; color: var(--ink); text-align: right; min-width: 92px; }
.bar-row .p { font-weight: 700; color: var(--blue); text-align: right; min-width: 52px; }

.tbl-wrap { overflow-x: auto; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; }
.rincian { min-width: 640px; }
.rincian thead th { background: var(--navy); color: #fff; font-weight: 700; padding: 8px 10px; }
.rincian thead tr:first-child th { font-size: 15px; text-transform: uppercase; }
.rincian thead tr:last-child th { font-weight: 500; font-size: 13.5px; padding-top: 0; }
.rincian td { padding: 4px 10px; line-height: 1.25; border-bottom: 1px solid var(--line); text-align: center; }
.rincian td.proj { text-align: left; font-weight: 700; color: var(--ink); }
.rincian tr.nodata-row td { color: var(--grey); }
.rincian tr.nodata-row td.proj { color: var(--muted); font-weight: 600; }
.nodata { color: var(--grey); font-weight: 600; font-size: 13px; }
.rincian td.tot { background: var(--blue-soft); font-weight: 700; color: var(--ink); }
.rincian td.tot small { display: block; font-weight: 400; font-size: 11.5px; line-height: 1.2; color: var(--muted); }
.rincian tr.group td { background: var(--blue-soft); text-align: left; font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--ink); padding: 5px 10px; border-left: 4px solid var(--gc); }
.rincian tr.grand td { padding-block: 8px; border-top: 3px solid var(--navy); border-bottom: none; font-size: 19px; font-weight: 800; color: var(--ink); background: var(--blue-soft); }
.rincian tr.grand td small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.st { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 3px; text-transform: uppercase; letter-spacing: .03em; color: var(--sc); background: var(--sb, var(--grey-soft)); }

.notes { margin-top: 30px; background: var(--blue-soft); border-left: 4px solid var(--navy); padding-block: 12px 14px; }
.notes h2 { font-size: 16px; }
.notes ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.notes b { color: var(--ink); }

/* Forms */
.form-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-top: 24px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--input-bg); color: var(--ink); font-weight: 600; }
.btn { font-weight: 700; font-size: 14px; border-radius: 4px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: transparent; color: var(--blue); border-color: var(--line); }
.btn.sec:hover { border-color: var(--blue); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.edit { min-width: 1100px; margin-top: 12px; }
.edit thead tr:first-child th:first-child { width: 52px; }
.edit select, .edit input[type="text"], .edit .msg { text-align: center; text-align-last: center; }
.edit { border: 1px solid var(--line); }
.edit th { border: 1px solid rgba(255, 255, 255, .28); }
.edit td { border: 1px solid var(--line); vertical-align: middle; }
.edit td:nth-child(2) select, .edit td:nth-child(2) input[type="text"] { min-width: 230px; }
.edit td:nth-child(3) select, .edit td:nth-child(3) input[type="text"] { min-width: 210px; }
.edit td.grup-cell { min-width: 220px; font-size: 13px; color: var(--muted); }
.edit select[data-sp] { min-width: 210px; }
.edit td input[id^="k-"] { min-width: 230px; }
.edit th { background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; padding: 8px; text-align: center; white-space: nowrap; line-height: 1.3; }
.edit td { border-bottom: 1px solid var(--line); padding: 6px; text-align: center; vertical-align: middle; }
.edit select, .edit input[type="number"], .edit input[type="text"] { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--input-bg); color: var(--ink); }
.edit input[type="number"] { text-align: center; max-width: 90px; }
.edit tr.err td { background: var(--red-soft); }
.edit .msg { font-size: 12px; font-weight: 700; color: var(--red); text-align: left; padding-top: 2px; }
.edit .ok { font-size: 12px; font-weight: 700; color: var(--green); }
.del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; line-height: 1; padding: 6px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.empty { border: 1px dashed var(--line); padding: 24px; text-align: center; color: var(--muted); margin-top: 16px; }

.sales-in { min-width: 0; width: max-content; }
.sales-in th, .sales-in td { padding: 5px 6px; font-size: 12.5px; }
.sales-in input[type="number"] { width: 64px; max-width: none; padding: 5px 6px; font-size: 12.5px; }
.sales-in input[data-j="1"] { width: 150px; }
.edit.sales-in td input[data-j="1"][type="text"] { min-width: 0; width: 150px; }
.edit.sales-in.rp-m td input[data-j="1"][type="text"] { width: 78px; }
.sales-in.rp-m td.calc { min-width: 0; }
.sales-in input[readonly] { background: var(--track); color: var(--ink); cursor: default; }
.seg { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
.seg-l { font-size: 13px; font-weight: 600; color: var(--muted); margin-right: 8px; }
.seg button { font-weight: 700; font-size: 13px; padding: 8px 14px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.seg button:first-of-type { border-radius: 4px 0 0 4px; }
.seg button:last-of-type { border-radius: 0 4px 4px 0; border-left: none; }
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.sales-in .stick { position: sticky; left: 0; z-index: 2; background: var(--bg); text-align: left; min-width: 180px; max-width: 220px; }
.sales-in thead .stick { background: var(--navy); z-index: 3; }
.sales-in .proj-in { font-weight: 700; color: var(--ink); }
.sales-in tr.grp td { background: var(--blue-soft); font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--ink); }
.sales-in tr.grp td.stick { background: var(--blue-soft); border-left: 4px solid var(--gc); height: 30px; overflow: visible; }
.sales-in tr.grp .grp-name { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); white-space: nowrap; z-index: 3; }
.sales-in td.calc { background: var(--track); color: var(--ink); font-weight: 600; min-width: 70px; }
.sales-in th.calc-h { background: var(--navy-2); }
.sales-in td.dari { line-height: 1.2; white-space: nowrap; }
.sales-in td.akst { padding: 4px 6px; }
.sales-in td.akst .ak { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.sales-in td.akst .dari-in { display: flex; align-items: center; gap: 4px; justify-content: center; font-size: 11px; font-weight: 700; color: var(--red); background: var(--red-soft); border-radius: 4px; padding: 3px 4px; }
.sales-in td.akst .dari-in input { background: var(--bg); border-color: var(--red-soft); }
.sales-in td.akst .dari-in input[readonly] { background: var(--bg); color: var(--ink); }
.sales-in tr.sum td.dari small { color: var(--red); font-weight: 700; }
.sales-in td.dari small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.sales-in .after input { opacity: .55; }
.sales-in th.after { opacity: .7; }
.sales-in tr.sum td { background: var(--blue-soft); font-weight: 800; color: var(--ink); }
.sales-in tr.sum td.stick { background: var(--blue-soft); }
.sales-in tr.err td.stick { background: var(--red-soft); }
.hist { min-width: 720px; }
.hist th { background: var(--navy); color: #fff; font-size: 13px; padding: 8px 10px; text-align: left; }
.hist td { border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: top; font-size: 13.5px; }
.hist td.nowrap { white-space: nowrap; color: var(--muted); }
.hist .bag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 3px; background: var(--blue-soft); color: var(--ink); white-space: nowrap; }
.hist td.chg ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 2px; }
.hist details { margin-top: 4px; font-size: 13px; }
.hist summary { cursor: pointer; color: var(--blue); font-weight: 600; }
.hist details ul { margin-top: 4px; }
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--side-bg); padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.login-card { width: 100%; max-width: 380px; background: var(--bg); border: 1px solid var(--side-line); border-top: 4px solid var(--gold); border-radius: 8px; padding: 28px 24px; display: flex; flex-direction: column; gap: 12px; }
.login-card .field input { width: 100%; padding: 10px 12px; font-size: 15px; background: var(--bg); }
.pw { display: flex; gap: 6px; }
.pw input { flex: 1; min-width: 0; }
.pw-t { border: 1px solid var(--line); background: var(--bg); color: var(--blue); font-weight: 600; font-size: 13px; border-radius: 4px; padding: 0 10px; cursor: pointer; }
.lg-err { margin: 0; font-size: 13px; font-weight: 600; color: var(--red); }
.lg-demo { margin-top: 8px; font-size: 12.5px; color: var(--muted); background: var(--blue-soft); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.lg-demo b { color: var(--ink); }
.lg-demo code { font-size: 12.5px; color: var(--ink); font-weight: 700; }
.who { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.who b { font-size: 14px; color: var(--side-ink); }
.who span { font-size: 12px; font-weight: 700; color: var(--gold-ink); }
.master { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
.master > div { min-width: 0; }
.master table th { background: var(--navy); color: #fff; font-size: 13px; padding: 8px; text-align: left; }
.master table td { border-bottom: 1px solid var(--line); padding: 6px; }
.master input[type="text"] { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--input-bg); color: var(--ink); }
.ord { background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; padding: 2px 6px; color: var(--muted); }

/* Shell + sidebar */
.shell { display: flex; min-height: 100vh; }
.side { width: 272px; flex: 0 0 272px; background: var(--side-bg); border-right: 1px solid var(--side-line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 0 18px 18px; }
.logo { padding-right: 18px; padding-bottom: 18px; border-bottom: 2px solid var(--gold); margin-right: 0; }
.logo-co { margin-top: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
.logo-app { margin-top: 4px; font-size: 17px; font-weight: 800; line-height: 1.2; color: var(--side-ink); }
.menu { padding: 18px 12px 0 0; display: flex; flex-direction: column; gap: 14px; }
.grp-h { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: none; text-align: left; font-weight: 700; font-size: 14px; color: var(--side-ink); cursor: pointer; padding: 4px 6px 4px 0; }
.chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -4px; flex: 0 0 auto; transition: transform .15s; }
.grp-h[aria-expanded="false"] .chev { transform: rotate(-45deg); margin-top: 0; }
.grp-h[aria-expanded="false"] + .grp-b { display: none; }
.grp-b { margin: 8px 0 0 6px; border-left: 1px solid var(--side-line); padding-left: 10px; display: flex; flex-direction: column; gap: 2px; }
.grp-b a { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-decoration: none; color: var(--side-ink); font-size: 13.5px; padding: 8px 10px; border-radius: 6px; position: relative; }
.grp-b a:hover { background: var(--side-hover); }
.grp-b a.on { background: var(--side-active); color: #fff; font-weight: 700; }
.grp-b.solo { margin: 0; border-left: none; padding-left: 0; }
.grp-b a.on::before { content: ""; position: absolute; left: -2px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--gold); }
.more { color: var(--muted); font-size: 16px; line-height: 1; }
.grp-b a.on .more { color: #fff; }
.sub { display: flex; flex-direction: column; gap: 2px; margin-left: 12px; }
.sub a { font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.35; padding: 7px 10px; }
.sub a.cur { font-weight: 700; color: var(--gold-ink); }
.side-foot { margin-top: auto; padding: 18px 18px 0 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.side-foot p { margin: 0; }
.side-foot .role select { background: var(--bg); color: var(--ink); border: 1px solid var(--side-line); border-radius: 4px; padding: 4px 6px; }
.main { flex: 1; min-width: 0; }
.mtop { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 29; }

/* Report sub-header */
.rhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 18px 0; }
.crumb { font-size: 12.5px; color: var(--muted); }
.crumb a { color: var(--muted); }
.rhead h2 { margin-top: 2px; }
.rtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 12px; }
.rtabs a { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px; padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.rtabs a:hover { color: var(--ink); }
.rtabs a.on { color: var(--ink); border-bottom-color: var(--gold); }

/* Report catalogue */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 20px; }
.rcard { border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--text); min-width: 0; }
a.rcard:hover { border-color: var(--gold); }
.rcard h3 { margin: 0; font-size: 16px; color: var(--ink); }
.rcard p { margin: 0; font-size: 13.5px; color: var(--muted); }
.rcard .meta { font-size: 13px; font-weight: 700; color: var(--ink); }
.rcard.soon { border-style: dashed; }
.placeholder { margin-top: 24px; border: 1px dashed var(--line); border-radius: 8px; padding: 32px; text-align: center; color: var(--muted); }
.placeholder h2 { margin-bottom: 6px; }

@media (max-width: 900px) {

<script>
/* ===================== Data & storage ===================== */
const KEY = "bast-ppn-dtp-mockup-v1";
const SEED = {
  role: "ADMIN",
  periode: [
    { id: 1, nama: "Nov-2023 s.d Des-2024", urutan: 1, aktif: true },
    { id: 2, nama: "Jan-2025 s.d Des-2025", urutan: 2, aktif: true },
    { id: 3, nama: "Jan-2026 s.d Des-2026", urutan: 3, aktif: true },
  ],
  proyek: [
    { id: 4, nama: "Banara Serpong", urutan: 1, aktif: true },
    { id: 1, nama: "Naraya Serpong", urutan: 2, aktif: true },
    { id: 2, nama: "Bio District", urutan: 3, aktif: true },
    { id: 10, nama: "Permai Indah", urutan: 4, aktif: true },
    { id: 5, nama: "Tanglin Parc", urutan: 5, aktif: true },
    { id: 6, nama: "Newton Springs", urutan: 6, aktif: true },
    { id: 8, nama: "Scotts Vale", urutan: 7, aktif: true },
    { id: 3, nama: "Mazenta Residence", urutan: 8, aktif: true },
    { id: 9, nama: "Marchand", urutan: 9, aktif: true },
    { id: 7, nama: "Orchard Riviera", urutan: 10, aktif: true },
  ],
  laporan: {
    "2026-11-03": [
      { periodeId: 1, proyekId: 1, d: [13, 13, 8, 8], ket: "" },
      { periodeId: 1, proyekId: 2, d: [17, 17, 0, 0], ket: "" },
      { periodeId: 2, proyekId: 3, d: [1, 1, 0, 0], ket: "" },
      { periodeId: 2, proyekId: 1, d: [0, 0, 2, 2], ket: "" },
      { periodeId: 2, proyekId: 2, d: [6, 6, 1, 2], ket: "" },
      { periodeId: 3, proyekId: 1, d: [1, 2, 0, 0], ket: "" },
      { periodeId: 3, proyekId: 4, d: [0, 1, 0, 0], ket: "" },
      { periodeId: 3, proyekId: 2, d: [2, 7, 0, 3], ket: "" },
      { periodeId: 3, proyekId: 3, d: [2, 2, 0, 0], ket: "" },
    ]
  }
};
const clone = o => JSON.parse(JSON.stringify(o));
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || clone(SEED); } catch (e) { S = clone(SEED); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
/* Akun login mockup. Ini bukan pengamanan sungguhan: semua kode dan data ada di browser. */
const USERS = [
  { u: "admin.chl", pw: "adminsales", nama: "Admin CHL", role: "ADMIN" },
  { u: "admin.tsc", pw: "adminsales", nama: "Admin TSC", role: "ADMIN" },
  { u: "admin.biodistrict", pw: "adminsales", nama: "Admin Bio District", role: "ADMIN" },
  { u: "admin.narayabanaraserpong", pw: "adminsales", nama: "Admin Naraya Banara Serpong", role: "ADMIN" },
  { u: "admin.permaiindah", pw: "adminsales", nama: "Admin Permai Indah", role: "ADMIN" },
  { u: "viewer.chl", pw: "adminsales", nama: "Viewer CHL", role: "VIEWER" },
];
let SESI = null;
try { SESI = JSON.parse(sessionStorage.getItem(KEY + "-sesi")); } catch (e) { SESI = null; }
if (SESI) S.role = SESI.role;
/* Nama proyek yang diganti */
S.proyek.forEach(p => { if (p.nama === "Marchand Hype Station") p.nama = "Marchand"; });
/* Tambahkan proyek baru dari data contoh ke data yang sudah tersimpan di browser */
SEED.proyek.forEach(sp => {
  if (!S.proyek.some(p => p.nama.toLowerCase() === sp.nama.toLowerCase())) {
    S.proyek.push({ id: Math.max(0, ...S.proyek.map(p => p.id)) + 1, nama: sp.nama, urutan: Math.max(0, ...S.proyek.map(p => p.urutan)) + 1, aktif: true });
  }
});
save();
/* Terapkan urutan proyek baru satu kali ke data yang sudah tersimpan */
if ((S.urutanV || 0) < 1) {
  SEED.proyek.forEach(sp => { const p = S.proyek.find(p => p.nama.toLowerCase() === sp.nama.toLowerCase()); if (p) p.urutan = sp.urutan; });
  S.proyek.filter(p => !SEED.proyek.some(sp => sp.nama.toLowerCase() === p.nama.toLowerCase())).forEach((p, k) => p.urutan = 100 + k);
  S.urutanV = 1; save();
}

/* ===================== Helpers ===================== */
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const ddmmyyyy = iso => iso.split("-").reverse().join("-");
const panjang = iso => { const [y, m, d] = iso.split("-"); return `${+d} ${BULAN[m - 1]} ${y}`; };
const f = n => n === 0 ? "–" : String(n);
const pct = (x, y) => y ? Math.round(x / y * 100) : 0;
const add = (a, b) => a.map((v, i) => v + b[i]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = ["var(--blue)", "var(--green)", "var(--gold)", "var(--navy-2)"];
const byUrut = (a, b) => a.urutan - b.urutan;
const perById = id => S.periode.find(p => p.id === id);
const prjById = id => S.proyek.find(p => p.id === id);
const dates = () => Object.keys(S.laporan).sort().reverse();
const todayISO = () => { const t = new Date(); return new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function status(b, t) {
  if (t === 0) return { t: "Tidak ada unit", c: "var(--grey)", b: "var(--grey-soft)" };
  if (b >= t) return { t: "Selesai", c: "var(--green)", b: "var(--green-soft)" };
  if (b === 0) return { t: `Sisa ${t} unit`, c: "var(--red)", b: "var(--red-soft)" };
  return { t: `Sisa ${t - b} unit`, c: "var(--gold)", b: "var(--gold-soft)" };
}
const toastEl = document.getElementById("toast");
let toastT;
/* ===================== History perubahan ===================== */
function catat(report, bagian, items) {
  if (!items || !items.length) return;
  S.history = S.history || [];
  S.history.unshift({ t: new Date().toISOString(), report, bagian, items, oleh: SESI ? SESI.nama : (S.role === "ADMIN" ? "Admin" : "Viewer") });
  S.history = S.history.slice(0, 500);
}
const waktuID = iso => { const d = new Date(iso); const z = n => String(n).padStart(2, "0");
  return `${z(d.getDate())}-${z(d.getMonth() + 1)}-${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const rpDot = v => Math.round(v).toLocaleString("id-ID");
function viewHistory(report) {
  const list = (S.history || []).filter(h => h.report === report || h.report === "semua");
  if (!list.length) return `<div class="page gut"><div class="empty" style="margin-top:24px">Belum ada perubahan tercatat. Setiap perubahan yang disimpan di Input Data atau Master akan muncul di sini.</div></div>`;
  const rows = list.map((h, i) => {
    const first = h.items.slice(0, 4).map(x => `<li>${esc(x)}</li>`).join("");
    const rest = h.items.length > 4 ? `<details><summary>dan ${h.items.length - 4} perubahan lainnya</summary><ul>${h.items.slice(4).map(x => `<li>${esc(x)}</li>`).join("")}</ul></details>` : "";
    return `<tr><td class="num nowrap">${waktuID(h.t)}</td><td><span class="bag">${esc(h.bagian)}</span></td><td class="chg"><ul>${first}</ul>${rest}</td><td>${esc(h.oleh)}</td></tr>`;
  }).join("");
  return `<div class="page gut"><div class="form-head"><div><h2>History Perubahan</h2>
    <div class="desc">${list.length} catatan, terbaru di atas. Dicatat setiap kali data disimpan di Input Data atau diubah di Master. Disimpan di browser ini saja.</div></div></div>
    <div class="tbl-wrap" style="margin-top:16px"><table class="hist"><thead><tr><th style="width:140px">Waktu</th><th style="width:120px">Bagian</th><th>Perubahan</th><th style="width:80px">Oleh</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function toast(m) { toastEl.textContent = m; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2400); }

/* ===================== Hitung (sesuai PRD bagian 5) ===================== */
function hitung(tgl) {
  const rows = S.laporan[tgl] || [];
  const grand = rows.reduce((a, r) => add(a, r.d), [0, 0, 0, 0]);
  /* Semua proyek aktif ditampilkan; proyek nonaktif hanya jika punya data */
  const tampil = S.proyek.filter(p => p.aktif || rows.some(r => r.proyekId === p.id)).sort(byUrut);
  const periodes = S.periode.slice().sort(byUrut).map(p => {
    const pr = rows.filter(r => r.periodeId === p.id)
      .sort((a, b) => (prjById(a.proyekId)?.urutan ?? 99) - (prjById(b.proyekId)?.urutan ?? 99));
    /* Hanya proyek yang punya angka di periode ini; urutan mengikuti Master */
    const rincian = tampil.map(j => ({ j, r: pr.find(r => r.proyekId === j.id) || null }))
      .filter(x => x.r && x.r.d.some(v => v > 0));
    return { p, rows: pr, rincian, sum: pr.reduce((a, r) => add(a, r.d), [0, 0, 0, 0]) };
  }).filter(x => x.rincian.length);
  const proyeks = tampil.map(p => ({ p, sum: rows.filter(r => r.proyekId === p.id).reduce((a, r) => add(a, r.d), [0, 0, 0, 0]) }))
    .filter(x => x.sum.some(v => v > 0));
  return { rows, grand, periodes, proyeks };
}
function teksWA(tgl) {
  const H = hitung(tgl);
  let t = `*Monitoring BAST All DTP Category*\nPerubahan Hari ini (${ddmmyyyy(tgl)})\n`;
  const g = n => n === 0 ? "-" : n;
  H.periodes.forEach(({ p, rows }) => {
    t += `\n*Periode PPN DTP (${p.nama})*\n`;
    rows.forEach(r => {
      t += `*${prjById(r.proyekId).nama.toUpperCase()}*\nBAST PPN DTP\n    Total ${g(r.d[0])} unit dari ${g(r.d[1])} unit\nBAST Non PPN DTP\n    Total ${g(r.d[2])} unit dari ${g(r.d[3])} unit\n`;
    });
  });
  return t;
}

/* ===================== Dashboard ===================== */
let selDate = dates()[0];
function viewDashboard() {
  const ds = dates();
  if (!ds.length) return `<div class="page gut"><div class="empty">Belum ada laporan. ${S.role === "ADMIN" ? 'Buka <a href="#bast-input">Input Data</a> untuk mengisi laporan pertama.' : "Minta admin mengisi laporan pertama."}</div></div>`;
  if (!ds.includes(selDate)) selDate = ds[0];
  const H = hitung(selDate), G = H.grand;
  const gB = G[0] + G[2], gT = G[1] + G[3];
  const kpi = (c, lbl, val, unit, p, note) => `<div class="kpi" style="--c:${c}"><div class="lbl">${lbl}</div>
    <div class="val num">${val} <small>${unit}</small></div><div class="pct num">${p}%</div><div class="note">${note}</div></div>`;
  const bar = (nm, b, t, c) => `<div class="bar-row"><span class="nm">${esc(nm)}</span>
    <div class="track"><div class="fill" style="--c:${c};width:${pct(b, t)}%"></div></div>
    ${t ? `<span class="u num">${b} / ${t} unit</span><span class="p num">${pct(b, t)}%</span>` : `<span class="u nodata">Belum ada data</span><span class="p num">–</span>`}</div>`;
  let tbl = `<thead><tr><th rowspan="2" style="text-align:center;width:30%">Proyek</th><th colspan="2">BAST PPN DTP</th><th colspan="2">BAST Non PPN DTP</th><th colspan="2">Total</th></tr>
    <tr><th>BAST</th><th>Unit</th><th>BAST</th><th>Unit</th><th>BAST</th><th>Status</th></tr></thead><tbody>`;
  const notes = [
    `BAST PPN DTP belum selesai: ${G[1] - G[0]} unit dari ${G[1]} unit.`,
    `BAST Non PPN DTP belum selesai: ${G[3] - G[2]} unit dari ${G[3]} unit.`,
    "Lihat kolom Status pada tabel rincian untuk proyek yang masih ada sisa unit.",
    "Data diambil dari tab Input Data. Untuk proyek atau periode baru, tambahkan namanya di tab Master.",
  ];
  H.periodes.forEach(({ p, rincian }, i) => {
    tbl += `<tr class="group" style="--gc:${COLORS[i % 4]}"><td colspan="7">Periode PPN DTP (${esc(p.nama)})</td></tr>`;
    rincian.forEach(({ j, r }) => {
      if (!r) {
        tbl += `<tr class="nodata-row"><td class="proj">${esc(j.nama)}</td><td>–</td><td>–</td><td>–</td><td>–</td>
          <td class="tot">–</td><td class="tot"><span class="st" style="--sc:var(--grey)">Belum ada data</span></td></tr>`;
        return;
      }
      const nm = j.nama, b = r.d[0] + r.d[2], t = r.d[1] + r.d[3], st = status(b, t);
      tbl += `<tr><td class="proj">${esc(nm)}</td><td>${f(r.d[0])}</td><td>${f(r.d[1])}</td><td>${f(r.d[2])}</td><td>${f(r.d[3])}</td>
        <td class="tot">${f(b)}<small>dari ${t}</small></td><td class="tot"><span class="st" style="--sc:${st.c};--sb:${st.b}">${st.t}</span></td></tr>`;
    });
  });
  tbl += `<tr class="grand"><td class="proj">Total</td><td>${G[0]}</td><td>${G[1]}</td><td>${G[2]}</td><td>${G[3]}</td><td>${gB}<small>dari ${gT}</small></td><td>${pct(gB, gT)}%</td></tr></tbody>`;
  const nProj = new Set(H.rows.map(r => r.proyekId)).size;
  return `<div class="page cap" id="capBast">
  <div class="hero">
    <div class="tabs"><span class="tab">Laporan BAST</span><span class="tab">${panjang(selDate)}</span></div>
    <div class="hero-body gut"><h1>Monitoring BAST All DTP Category</h1><div class="sub">Perubahan hari ini (${ddmmyyyy(selDate)})</div></div>
    <div class="strip gut"><span>Data BAST ${nProj} proyek • ${H.periodes.length} periode PPN DTP</span>
      <div class="strip-actions no-cap">
        <label for="dateSel" style="font-size:13px">Tanggal</label>
        <select id="dateSel">${ds.map(d => `<option value="${d}" ${d === selDate ? "selected" : ""}>${ddmmyyyy(d)}</option>`).join("")}</select>
        <button class="btn-ghost" id="copyBtn" type="button">Salin teks laporan</button>
        <button class="btn-ghost" id="xlsBtn" type="button">Ekspor Excel</button>
        <button class="btn-ghost" id="shotBtn" type="button">Unduh gambar</button>
      </div></div>
  </div>
  <div class="kpis gut">
    ${kpi("var(--gold)", "Total BAST", gB, `/ ${gT} unit`, pct(gB, gT), "Seluruh periode & jenis")}
    ${kpi("var(--blue)", "BAST PPN DTP", G[0], `/ ${G[1]} unit`, pct(G[0], G[1]), `Sisa ${G[1] - G[0]} unit`)}
    ${kpi("var(--green)", "BAST Non PPN DTP", G[2], `/ ${G[3]} unit`, pct(G[2], G[3]), `Sisa ${G[3] - G[2]} unit`)}
    ${kpi("var(--red)", "Belum BAST", gT - gB, "unit", gT ? 100 - pct(gB, gT) : 0, `Dari ${gT} unit total`)}
  </div>
  <section class="gut"><h2>Progres BAST per Periode</h2><div class="desc">Unit sudah BAST dibanding total unit pada periode PPN DTP.</div>
    <div class="bars">${H.periodes.map((x, i) => bar(x.p.nama, x.sum[0] + x.sum[2], x.sum[1] + x.sum[3], COLORS[i % 4])).join("")}</div></section>
  <section class="gut"><h2>Progres BAST per Proyek</h2><div class="desc">Gabungan seluruh periode, PPN DTP dan Non PPN DTP. Proyek tanpa angka tidak ditampilkan.</div>
    <div class="bars">${H.proyeks.map((x, i) => bar(x.p.nama, x.sum[0] + x.sum[2], x.sum[1] + x.sum[3], COLORS[i % 4])).join("")}</div></section>
  <section><div class="gut"><h2>Rincian per Periode &amp; Proyek</h2><div class="desc">Angka dibaca “BAST dari total unit”. Tanda “–” berarti 0 unit.</div></div>
    <div class="tbl-wrap"><table class="rincian num">${tbl}</table></div></section>
  <div class="notes gut"><h2>Catatan Penting</h2><ul>${notes.map(n => `<li>${n}</li>`).join("")}</ul></div>
  </div>`;
}
function bindDashboard() {
  const ds = document.getElementById("dateSel");
  if (!ds) return;
  ds.onchange = () => { selDate = ds.value; render(); };
  document.getElementById("copyBtn").onclick = () => {
    const txt = teksWA(selDate);
    navigator.clipboard.writeText(txt).then(() => toast("Teks laporan disalin")).catch(() => {
      const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Teks laporan disalin"); } catch (e) { toast("Gagal menyalin. Coba lagi."); }
      ta.remove();
    });
  };
  document.getElementById("xlsBtn").onclick = () => exportExcel(selDate);
  document.getElementById("shotBtn").onclick = () => unduhGambar("capBast", `Monitoring_BAST_${ddmmyyyy(selDate)}.png`);
}

/* ===================== Unduh gambar (screenshot dashboard) ===================== */
const H2C_URL = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
function muatH2C() {
  if (window.html2canvas) return Promise.resolve();
  return new Promise((ok, gagal) => {
    const sc = document.createElement("script"); sc.src = H2C_URL; sc.onload = ok; sc.onerror = () => gagal(new Error("load"));
    document.head.appendChild(sc);
  });
}
let sedangGambar = false;
async function unduhGambar(id, nama) {
  const el = document.getElementById(id);
  if (!el || sedangGambar) return;
  sedangGambar = true; toast("Menyiapkan gambar…");
  try {
    await muatH2C();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const bg = getComputedStyle(document.body).backgroundColor;
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: bg, useCORS: true, logging: false,
      ignoreElements: n => n.classList && n.classList.contains("no-cap") });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    const url = URL.createObjectURL(blob), a = document.createElement("a");

function salesText() {
  const m = bulanAktif(), tgl = tanggalTampil(m), bln = `${BULAN[m - 1]} ${tahunKe()}`, { rows, tot: T } = hitungSales();
  let t = `*Dashboard Penjualan Properti*\n${panjang(tgl)}\n\n`;
  t += `Hari ini: ${T.hari[0]} unit (${rp(T.hari[1])})\nBulan ${bln}: ${T.bln[0]} unit (${rp(T.bln[1])})\nYTD s.d. ${BULAN[m - 1]}: ${T.ytd[0]} unit (${rp(T.ytd[1])})\nAkumulasi terjual: ${T.akum[0]} dari ${T.stok[0]} unit (${rp(T.akum[1])})\n`;
  const k = rows.filter(x => x.bln[0] > 0).sort((a, b) => b.bln[1] - a.bln[1]);

}

/* Ekspor Excel dengan rumus yang saling terhubung, seperti file aslinya */
function exportSalesExcel() {
  if (!window.XLSX) { toast("Ekspor Excel belum siap. Periksa koneksi internet."); return; }
  const m = bulanAktif(), tgl = tanggalTampil(m), th = tahunKe(), cur = bulanIni(m), list = S.sales2.proyek.filter(p => p.aktif).sort(byUrut);
  const col = n => { let s = ""; n++; while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
  /* Kolom sheet "input data": A Proyek, B Grup, C-D akumulasi s.d. tahun lalu, E-AB Jan–Des, AC-AD YTD, AE-AF Akumulasi, AG-AH Stok, AI-AJ Hari ini */
  const cU = i => col(4 + i * 2), cR = i => col(5 + i * 2);
  const head1 = ["Proyek", "Grup", `Akumulasi s.d. ${th - 1}`, "", ...BULAN.flatMap(b => [`${b} ${th}`, ""]), `YTD ${BULAN[m - 1]}`, "", "Akumulasi terjual", "", "Total stok", "", "Hari ini", ""];
  const head2 = ["", "", "Unit", "Rp", ...BULAN.flatMap(() => ["Unit", "Rp"]), "Unit", "Rp", "Unit", "Rp", "Unit", "Rp", "Unit", "Rp"];
  const inp = [["INPUT DATA PENJUALAN PER PROYEK (Rupiah penuh)"], [`Bulan laporan: ${BULAN[m - 1]} ${th}. YTD menjumlahkan Januari s.d. ${BULAN[m - 1]} ${th}.`], head1, head2];
  const first = 5;
  list.forEach((p, k) => {
    const r = first + k;
    const ytdU = Array.from({ length: m }, (_, i) => cU(i) + r).join("+"), ytdR = Array.from({ length: m }, (_, i) => cR(i) + r).join("+");
    inp.push([p.nama, p.grup, p.base[0], p.base[1], ...p.bulan.flat(), { f: ytdU }, { f: ytdR }, { f: `C${r}+AC${r}` }, { f: `D${r}+AD${r}` }, p.stok[0], p.stok[1], cur ? p.hari[0] : 0, cur ? p.hari[1] : 0]);
  });
  const last = first + list.length - 1, totR = last + 1;
  inp.push(["TOTAL CHL", "", ...Array.from({ length: 34 }, (_, i) => ({ f: `SUM(${col(2 + i)}${first}:${col(2 + i)}${last})` }))]);
  const I = c => `'input data'!${c}`;
  const dash = [["SALES PERFORMANCE", "", "", "", "", panjang(tgl).toUpperCase()], ["DASHBOARD PENJUALAN PROPERTI"], [`${BULAN[m - 1]} ${th}  •  YTD ${BULAN[m - 1]} ${th}  •  Total Terjual`], [],
    ["", "Laporan hari ini", `Bulan ${BULAN[m - 1]} ${th}`, `YTD s.d. ${BULAN[m - 1]}`, "Akumulasi total terjual"],
    ["Unit", { f: I(`AI${totR}`) }, { f: I(`${cU(m - 1)}${totR}`) }, { f: I(`AC${totR}`) }, { f: I(`AE${totR}`) }],
    ["Rp M", { f: I(`AJ${totR}`) + "/10^9" }, { f: I(`${cR(m - 1)}${totR}`) + "/10^9" }, { f: I(`AD${totR}`) + "/10^9" }, { f: I(`AF${totR}`) + "/10^9" }],
    [], ["Proyek", "Grup", `${BULAN[m - 1]} unit`, `${BULAN[m - 1]} Rp M`, "YTD unit", "YTD Rp M", "Terjual unit", "Terjual Rp M", "Stok unit", "Stok Rp M"]];
  const d0 = dash.length + 1;
  list.forEach((p, k) => {
    const r = first + k;
    dash.push([{ f: I(`A${r}`) }, { f: I(`B${r}`) }, { f: I(`${cU(m - 1)}${r}`) }, { f: I(`${cR(m - 1)}${r}`) + "/10^9" }, { f: I(`AC${r}`) }, { f: I(`AD${r}`) + "/10^9" },
      { f: I(`AE${r}`) }, { f: I(`AF${r}`) + "/10^9" }, { f: I(`AG${r}`) }, { f: I(`AH${r}`) + "/10^9" }]);
  });
  const d1 = dash.length;
  dash.push(["TOTAL CHL", "", ...["C", "D", "E", "F", "G", "H", "I", "J"].map(c => ({ f: `SUM(${c}${d0}:${c}${d1})` }))]);
  const dt = dash.length;
  dash.push([], ["CATATAN PENTING"], [`CHL = total konsolidasi ${list.length} proyek, bukan proyek tambahan. Jangan dijumlahkan dua kali.`],
    [{ f: `"Total nilai proyek CHL: Rp"&TEXT(J${dt},"#,##0.00")&" M | Total terjual: Rp"&TEXT(H${dt},"#,##0.00")&" M ("&TEXT(H${dt}/J${dt},"0.0%")&")"` }],
    [`Sumber: Daily Report per ${panjang(tgl)} • M = Rp miliar`]);
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(dash); ws1["!cols"] = [{ wch: 24 }, { wch: 34 }, ...Array(8).fill({ wch: 15 })];
  const ws2 = XLSX.utils.aoa_to_sheet(inp); ws2["!cols"] = [{ wch: 22 }, { wch: 34 }, ...Array(34).fill({ wch: 15 })];
  XLSX.utils.book_append_sheet(wb, ws1, "Dashboard");
  XLSX.utils.book_append_sheet(wb, ws2, "input data");
  XLSX.writeFile(wb, `Dashboard_Penjualan_Properti_${tgl}.xlsx`);
  toast("File Excel diunduh");
}

function bindSalesInput() {

  v.querySelectorAll("[data-smn]").forEach(inp => inp.onchange = () => {
    const x = byId(inp.dataset.smn), nm = inp.value.trim();
    if (!nm) { inp.value = x.nama; toast("Nama tidak boleh kosong"); return; }
    if (S.sales2.proyek.some(o => o !== x && o.nama.toLowerCase() === nm.toLowerCase())) { inp.value = x.nama; toast("Nama sudah dipakai"); return; }
    if (nm === x.nama) return;
    catat("penjualan", "Master", [`Proyek diganti nama: ${x.nama} → ${nm}`]); x.nama = nm; sDraft = null; save(); toast("Nama disimpan");
  });
  v.querySelectorAll("[data-smg]").forEach(inp => inp.onchange = () => {
    const x = byId(inp.dataset.smg), g = inp.value.trim();
    if (!g) { inp.value = x.grup; toast("Grup tidak boleh kosong"); return; }
    if (g === x.grup) return;
    catat("penjualan", "Master", [`${x.nama} · Grup: ${x.grup} → ${g}`]); x.grup = g; sDraft = null; save(); toast("Grup disimpan");
  });
  v.querySelectorAll("[data-sma]").forEach(c => c.onchange = () => { const x = byId(c.dataset.sma); x.aktif = c.checked;
    catat("penjualan", "Master", [`Proyek ${x.nama} ${c.checked ? "diaktifkan" : "dinonaktifkan"}`]); sDraft = null; save(); toast(c.checked ? "Diaktifkan" : "Dinonaktifkan"); });
  v.querySelectorAll("[data-smup]").forEach(b => b.onclick = () => {
    const items = S.sales2.proyek.slice().sort(byUrut), x = byId(b.dataset.smup), o = items[items.indexOf(x) - 1];
    [x.urutan, o.urutan] = [o.urutan, x.urutan]; catat("penjualan", "Master", [`Urutan proyek: ${x.nama} dipindah ke atas ${o.nama}`]); sDraft = null; save(); render();
  });
  document.getElementById("smAdd").onclick = () => {
    const nm = document.getElementById("smNewN").value.trim(), g = document.getElementById("smNewG").value.trim();
    if (!nm || !g) { toast("Isi nama proyek dan grup"); return; }
    if (S.sales2.proyek.some(o => o.nama.toLowerCase() === nm.toLowerCase())) { toast("Nama sudah dipakai"); return; }
    const id = Math.max(0, ...S.sales2.proyek.map(o => o.id)) + 1, ur = Math.max(0, ...S.sales2.proyek.map(o => o.urutan)) + 1;
    S.sales2.proyek.push(proyekBaru(id, nm, g, ur)); catat("penjualan", "Master", [`Proyek baru ditambahkan: ${nm} (${g})`]); sDraft = null; save(); render(); toast(`${nm} ditambahkan`);
  };
}

/* ===================== Daftar report (tambah report baru di sini) ===================== */
const REPORTS = [
  { id: "bast", nama: "Dashboard Monitoring BAST All DTP Category", menu: "DASHBOARD MONITORING BAST ALL DTP CATEGORY", desc: "Progres BAST unit PPN DTP dan Non PPN DTP per periode dan proyek.",
    tabs: [
      { id: "bast", label: "Dashboard", view: viewDashboard, bind: bindDashboard },
      { id: "bast-input", label: "Input Data", view: viewInput, bind: bindInput, admin: true },
      { id: "bast-master", label: "Master", view: viewMaster, bind: bindMaster, admin: true },
      { id: "bast-history", label: "History", view: () => viewHistory("bast"), bind: () => {} },
    ],
    meta: () => { const d = dates()[0]; if (!d) return "Belum ada laporan"; const G = hitung(d).grand; return `Laporan ${ddmmyyyy(d)} · ${G[0] + G[2]} / ${G[1] + G[3]} unit BAST`; } },
  { id: "penjualan", nama: "Dashboard Penjualan Properti", menu: "DASHBOARD PENJUALAN PROPERTI", desc: "Unit dan nilai penjualan per proyek: hari ini, bulan laporan, YTD, dan akumulasi terjual. Mengikuti format Excel Daily Report.",
    tabs: [
      { id: "penjualan", label: "Dashboard", view: viewSales, bind: bindSales },
      { id: "penjualan-input", label: "Input Data", view: viewSalesInput, bind: bindSalesInput, admin: true },
      { id: "penjualan-master", label: "Master", view: viewSalesMaster, bind: bindSalesMaster, admin: true },
      { id: "penjualan-history", label: "History", view: () => viewHistory("penjualan"), bind: () => {} },
    ],
    meta: () => { const T = hitungSales().tot; return `Laporan ${ddmmyyyy(S.sales2.tanggal)} · ${T.bln[0]} unit bulan ini · ${rp(T.bln[1])}`; } },
];
function viewLaporan() {
  return `<div class="page gut"><div class="rhead"><div><h2>Monitoring Laporan</h2>
    <div class="desc">Pilih report untuk melihat dashboard atau mengisi data.</div></div></div>
    <div class="cards">${REPORTS.map(r => `<a class="rcard" href="#${r.id}"><h3>${esc(r.nama)}</h3><p>${esc(r.desc)}</p><span class="meta">${esc(r.meta())}</span></a>`).join("")}
      <div class="rcard soon"><h3>Report lainnya</h3><p>Report berikutnya akan muncul di sini dengan format yang sama: dashboard, input data, dan master.</p></div></div></div>`;
}
function reportFrame(r, tab, inner) {
  const tabs = r.tabs.filter(t => !t.admin || S.role === "ADMIN");
  return `<div class="page gut"><div class="rhead"><div><div class="crumb"><a href="#laporan">Monitoring Laporan</a> / ${esc(r.nama)}</div><h2>${esc(r.nama)}</h2></div></div>
    <nav class="rtabs" aria-label="Bagian report">${tabs.map(t => `<a href="#${t.id}" class="${t.id === tab.id ? "on" : ""}" ${t.id === tab.id ? 'aria-current="page"' : ""}>${t.label}</a>`).join("")}</nav></div>${inner}`;
}
function findTab(v) { for (const r of REPORTS) for (const t of r.tabs) if (t.id === v) return { r, t }; return null; }

/* ===================== Router ===================== */
function current() {
  let v = location.hash.slice(1);
  if (v === "dashboard") v = "bast"; else if (v === "input") v = "bast-input"; else if (v === "master") v = "bast-master";
  if (!(v === "laporan" || findTab(v))) v = "laporan";
  const ft = findTab(v);
  if (ft && ft.t.admin && S.role !== "ADMIN") { v = ft.r.tabs[0].id; history.replaceState(null, "", "#" + v); }
  return v;
}
function renderMenu(v) {
  const ft = findTab(v);
  document.getElementById("reportMenu").innerHTML = REPORTS.map(r =>
    `<a href="#${r.tabs[0].id}" class="${ft && ft.r === r ? "cur" : ""}">${esc(r.menu || r.nama)}</a>`).join("");
  document.querySelectorAll("#menu .grp-b > a").forEach(a => {
    const on = a.dataset.v === v || (a.dataset.v === "laporan" && (v === "laporan" || ft));
    a.classList.toggle("on", !!on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
let rendering = false;
function render(focusId) {
  if (rendering) return;
  const masuk = !!SESI;
  document.getElementById("loginScreen").hidden = masuk;
  document.getElementById("shell").hidden = !masuk;
  if (!masuk) { document.title = "Masuk · Monitoring Laporan CHL"; return; }
  document.title = "Monitoring Laporan CHL";
  document.getElementById("whoName").textContent = SESI.nama;
  document.getElementById("whoRole").textContent = SESI.role === "ADMIN" ? "Admin" : "Viewer";
  rendering = true;
  const v = current();
  try {
    const view = document.getElementById("view"), ft = findTab(v);
    if (ft) { view.innerHTML = reportFrame(ft.r, ft.t, ft.t.view()); ft.t.bind(); }
    else view.innerHTML = viewLaporan();
    renderMenu(v);
  } finally { rendering = false; }
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}

/* Sidebar: grup lipat dan menu ponsel */
const side = document.getElementById("side"), scrim = document.getElementById("scrim"), burger = document.getElementById("burger");
function setMenu(open) { side.classList.toggle("open", open); scrim.hidden = !open; burger.setAttribute("aria-expanded", String(open)); }
burger.onclick = () => setMenu(!side.classList.contains("open"));
scrim.onclick = () => setMenu(false);
side.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });

/* Login dan logout */
document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  const u = document.getElementById("lgUser").value.trim().toLowerCase(), pw = document.getElementById("lgPass").value;
  const err = document.getElementById("lgErr"), akun = USERS.find(x => x.u === u && x.pw === pw);
  if (!u || !pw) { err.textContent = "Isi username dan password."; err.hidden = false; return; }
  if (!akun) { err.textContent = "Username atau password salah. Periksa lalu coba lagi."; err.hidden = false; document.getElementById("lgPass").select(); return; }
  err.hidden = true; SESI = { u: akun.u, nama: akun.nama, role: akun.role };
  try { sessionStorage.setItem(KEY + "-sesi", JSON.stringify(SESI)); } catch (x) {}
  S.role = akun.role; save(); document.getElementById("lgPass").value = "";
  if (!location.hash) history.replaceState(null, "", "#laporan");
  render(); toast(`Selamat datang, ${akun.nama}`);
});
document.getElementById("lgShow").onclick = () => {
  const i = document.getElementById("lgPass"), b = document.getElementById("lgShow"), show = i.type === "password";
  i.type = show ? "text" : "password"; b.textContent = show ? "Sembunyikan" : "Lihat"; b.setAttribute("aria-label", show ? "Sembunyikan password" : "Tampilkan password");
};
document.getElementById("logoutBtn").onclick = () => {
  SESI = null; try { sessionStorage.removeItem(KEY + "-sesi"); } catch (x) {}
  draft = null; sDraft = null; setMenu(false); render(); document.getElementById("lgUser").focus(); toast("Anda sudah keluar");
};
document.getElementById("resetBtn").onclick = () => {
  const role = S.role, hist = S.history || [], rpMode = S.rpMode; S = clone(SEED); S.role = role; S.history = hist; S.rpMode = rpMode; salesBulan = null; S.sales2 = clone(SALES2_SEED); S.sales2.hariTanggal = null; ikutiHariIni(); catat("semua", "Data contoh", ["Semua data dikembalikan ke data contoh"]); save(); draft = null; sDraft = null; selDate = dates()[0]; render(); toast("Data contoh dikembalikan");
};
window.addEventListener("hashchange", () => { if (current() === "bast-input" && draft === null) loadDraft(dates()[0] || todayISO()); if (current() === "penjualan-input" && sDraft === null) sLoad(); render(); window.scrollTo(0, 0); });
if (!location.hash) history.replaceState(null, "", "#bast");
render();
</script>
