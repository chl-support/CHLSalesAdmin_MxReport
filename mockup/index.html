<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monitoring Laporan CHL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #ffffff; --ink: #0f2140; --text: #1c2533; --muted: #5d6878; --line: #dfe4ec;
  --navy: #0d2a57; --navy-2: #163a70; --blue: #2a6fc0; --blue-soft: #e8eef7;
  --green: #1f8a55; --gold: #c98a12; --red: #c0392b; --grey: #8a9893; --track: #f1f4f8;
  --input-bg: #fffbea; --on-navy: #ffffff;
  --side-bg: #f3f2ee; --side-ink: #1b1d22; --side-line: #dcdad3; --side-hover: #e8e6df; --side-active: #1c1d21;
  --gold: #c9971c; --gold-ink: #a87a0e;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1522; --ink: #e4ebf7; --text: #d5dce7; --muted: #95a1b3; --line: #253247;
    --navy: #0b2148; --navy-2: #15346a; --blue: #6aa6ec; --blue-soft: #18263d;
    --green: #4fc788; --gold: #e8b04a; --red: #ef7a6c; --grey: #7d8d87; --track: #172234;
    --input-bg: #1d2433; color-scheme: dark;
    --side-bg: #141a24; --side-ink: #e4e7ee; --side-line: #2a3343; --side-hover: #1d2533; --side-active: #2a3446;
    --gold: #e0b44a; --gold-ink: #e8c46a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.45; }
.page { max-width: 1240px; margin: 0 auto; padding-bottom: 48px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* App bar */
.appbar { background: var(--navy); color: var(--on-navy); }
.appbar-in { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { font-weight: 800; letter-spacing: .02em; margin-right: auto; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: 600; font-size: 14px; opacity: .8; }
.nav a:hover { opacity: 1; background: rgba(255,255,255,.08); }
.nav a[aria-current="page"] { opacity: 1; background: var(--blue); }
.role { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.role select { background: var(--navy-2); color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 4px 6px; }
.mockbar { background: var(--blue-soft); color: var(--ink); font-size: 12.5px; padding-block: 6px; display: flex; gap: 12px; justify-content: space-between; flex-wrap: wrap; align-items: center; }
.linkbtn { background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; }

/* Hero */
.hero { background: var(--navy); color: var(--on-navy); border-top: 1px solid rgba(255,255,255,.12); }
.tabs { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.tab { background: var(--blue); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 22px; }
.hero-body { padding-block: 16px 18px; }
.hero h1 { margin: 0; font-size: clamp(24px, 4.6vw, 40px); font-weight: 800; text-transform: uppercase; line-height: 1.1; text-wrap: balance; }
.hero .sub { margin-top: 10px; font-size: 16px; opacity: .9; }
.strip { background: var(--navy-2); color: #fff; padding-block: 10px; font-size: 15px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.strip-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-ghost { font-weight: 600; font-size: 13px; color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.btn-ghost:hover { background: rgba(255,255,255,.12); }
.strip select { background: var(--navy); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; padding: 4px 8px; font-size: 13px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; }
.kpi { border-left: 4px solid var(--c); padding: 6px 14px 10px; min-width: 0; }
.kpi .lbl { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.kpi .val { font-size: 34px; font-weight: 800; color: var(--ink); line-height: 1.1; margin-top: 8px; }
.kpi .val small { font-size: 17px; font-weight: 600; color: var(--muted); }
.kpi .pct { font-size: 22px; font-weight: 700; color: var(--c); margin-top: 4px; }
.kpi .note { font-size: 13px; color: var(--muted); margin-top: 4px; }

section { margin-top: 30px; }
h2 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 800; text-transform: uppercase; }
.desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
.bars { margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(120px, 28%) 1fr auto auto; align-items: center; gap: 14px; padding-block: 6px; border-bottom: 1px solid var(--line); }
.bar-row .nm { font-weight: 700; color: var(--ink); }
.bar-row .track { height: 30px; background: var(--track); overflow: hidden; }
.bar-row .fill { height: 100%; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 18%, var(--bg))); }
.bar-row .u { font-weight: 700; color: var(--ink); text-align: right; min-width: 92px; }
.bar-row .p { font-weight: 700; color: var(--blue); text-align: right; min-width: 52px; }

.tbl-wrap { overflow-x: auto; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; }
.rincian { min-width: 640px; }
.rincian thead th { background: var(--navy); color: #fff; font-weight: 700; padding: 8px 10px; }
.rincian thead tr:first-child th { font-size: 15px; text-transform: uppercase; }
.rincian thead tr:last-child th { font-weight: 500; font-size: 13.5px; padding-top: 0; }
.rincian td { padding: 12px 10px; border-bottom: 1px solid var(--line); text-align: center; }
.rincian td.proj { text-align: left; font-weight: 700; color: var(--ink); }
.rincian td.tot { background: var(--blue-soft); font-weight: 700; color: var(--ink); }
.rincian td.tot small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.rincian tr.group td { background: var(--blue-soft); text-align: left; font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--ink); padding: 8px 10px; border-left: 4px solid var(--gc); }
.rincian tr.grand td { border-top: 3px solid var(--navy); border-bottom: none; font-size: 19px; font-weight: 800; color: var(--ink); background: var(--blue-soft); }
.rincian tr.grand td small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.st { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 3px; text-transform: uppercase; letter-spacing: .03em; color: var(--sc); background: color-mix(in srgb, var(--sc) 14%, var(--bg)); }

.notes { margin-top: 30px; background: var(--blue-soft); border-left: 4px solid var(--navy); padding-block: 12px 14px; }
.notes h2 { font-size: 16px; }
.notes ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.notes b { color: var(--ink); }

/* Forms */
.form-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-top: 24px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--input-bg); color: var(--ink); font-weight: 600; }
.btn { font-weight: 700; font-size: 14px; border-radius: 4px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sec { background: transparent; color: var(--blue); border-color: var(--line); }
.btn.sec:hover { border-color: var(--blue); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.edit { min-width: 1100px; margin-top: 12px; }
.edit thead tr:first-child th:first-child { width: 52px; }
.edit { border: 1px solid var(--line); }
.edit th { border: 1px solid rgba(255, 255, 255, .28); }
.edit td { border: 1px solid var(--line); vertical-align: middle; }
.edit td:nth-child(2) select, .edit td:nth-child(2) input[type="text"] { min-width: 230px; }
.edit td:nth-child(3) select, .edit td:nth-child(3) input[type="text"] { min-width: 210px; }
.edit th { background: var(--navy); color: #fff; font-size: 13px; font-weight: 700; padding: 8px; text-align: center; white-space: nowrap; line-height: 1.3; }
.edit td { border-bottom: 1px solid var(--line); padding: 6px; text-align: center; vertical-align: middle; }
.edit select, .edit input[type="number"], .edit input[type="text"] { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--input-bg); color: var(--ink); }
.edit input[type="number"] { text-align: center; max-width: 90px; }
.edit tr.err td { background: color-mix(in srgb, var(--red) 8%, var(--bg)); }
.edit .msg { font-size: 12px; font-weight: 700; color: var(--red); text-align: left; padding-top: 2px; }
.edit .ok { font-size: 12px; font-weight: 700; color: var(--green); }
.del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; line-height: 1; padding: 6px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }
.empty { border: 1px dashed var(--line); padding: 24px; text-align: center; color: var(--muted); margin-top: 16px; }

.master { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
.master > div { min-width: 0; }
.master table th { background: var(--navy); color: #fff; font-size: 13px; padding: 8px; text-align: left; }
.master table td { border-bottom: 1px solid var(--line); padding: 6px; }
.master input[type="text"] { width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--input-bg); color: var(--ink); }
.ord { background: none; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; padding: 2px 6px; color: var(--muted); }

/* Shell + sidebar */
.shell { display: flex; min-height: 100vh; }
.side { width: 272px; flex: 0 0 272px; background: var(--side-bg); border-right: 1px solid var(--side-line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 0 18px 18px; }
.logo { padding-right: 18px; padding-bottom: 18px; border-bottom: 2px solid var(--gold); margin-right: 0; }
.logo-co { margin-top: 0; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gold-ink); }
.logo-app { margin-top: 4px; font-size: 17px; font-weight: 800; line-height: 1.2; color: var(--side-ink); }
.menu { padding: 18px 12px 0 0; display: flex; flex-direction: column; gap: 14px; }
.grp-h { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; background: none; border: none; text-align: left; font-weight: 700; font-size: 14px; color: var(--side-ink); cursor: pointer; padding: 4px 6px 4px 0; }
.chev { width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); margin-top: -4px; flex: 0 0 auto; transition: transform .15s; }
.grp-h[aria-expanded="false"] .chev { transform: rotate(-45deg); margin-top: 0; }
.grp-h[aria-expanded="false"] + .grp-b { display: none; }
.grp-b { margin: 8px 0 0 6px; border-left: 1px solid var(--side-line); padding-left: 10px; display: flex; flex-direction: column; gap: 2px; }
.grp-b a { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-decoration: none; color: var(--side-ink); font-size: 13.5px; padding: 8px 10px; border-radius: 6px; position: relative; }
.grp-b a:hover { background: var(--side-hover); }
.grp-b a.on { background: var(--side-active); color: #fff; font-weight: 700; }
.grp-b.solo { margin: 0; border-left: none; padding-left: 0; }
.grp-b a.on::before { content: ""; position: absolute; left: -2px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--gold); }
.more { color: var(--muted); font-size: 16px; line-height: 1; }
.grp-b a.on .more { color: #fff; }
.sub { display: flex; flex-direction: column; gap: 2px; margin-left: 12px; }
.sub a { font-size: 12px; font-weight: 600; letter-spacing: .02em; line-height: 1.35; padding: 7px 10px; }
.sub a.cur { font-weight: 700; color: var(--gold-ink); }
.side-foot { margin-top: auto; padding: 18px 18px 0 0; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.side-foot p { margin: 0; }
.side-foot .role select { background: var(--bg); color: var(--ink); border: 1px solid var(--side-line); border-radius: 4px; padding: 4px 6px; }
.main { flex: 1; min-width: 0; }
.mtop { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 29; }

/* Report sub-header */
.rhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; padding-block: 18px 0; }
.crumb { font-size: 12.5px; color: var(--muted); }
.crumb a { color: var(--muted); }
.rhead h2 { margin-top: 2px; }
.rtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-top: 12px; }
.rtabs a { text-decoration: none; color: var(--muted); font-weight: 700; font-size: 14px; padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.rtabs a:hover { color: var(--ink); }
.rtabs a.on { color: var(--ink); border-bottom-color: var(--gold); }

/* Report catalogue */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 20px; }
.rcard { border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--text); min-width: 0; }
a.rcard:hover { border-color: var(--gold); }
.rcard h3 { margin: 0; font-size: 16px; color: var(--ink); }
.rcard p { margin: 0; font-size: 13.5px; color: var(--muted); }
.rcard .meta { font-size: 13px; font-weight: 700; color: var(--ink); }
.rcard.soon { border-style: dashed; }
.placeholder { margin-top: 24px; border: 1px dashed var(--line); border-radius: 8px; padding: 32px; text-align: center; color: var(--muted); }
.placeholder h2 { margin-bottom: 6px; }

@media (max-width: 900px) {
  .side { position: fixed; left: 0; top: 0; z-index: 30; transform: translateX(-100%); transition: transform .2s; padding-top: calc(22px + env(safe-area-inset-top, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); }
  .side.open { transform: none; }
  .mtop { display: flex; align-items: center; gap: 12px; background: var(--side-bg); border-bottom: 2px solid var(--gold); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); position: sticky; top: 0; z-index: 10; }
  .mtop-t { font-weight: 800; color: var(--side-ink); }
  .burger { background: none; border: 1px solid var(--side-line); border-radius: 6px; padding: 8px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .burger span { display: block; width: 18px; height: 2px; background: var(--side-ink); }
}

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; z-index: 20; }

@media (max-width: 760px) {
  .kpis { grid-template-columns: 1fr 1fr; row-gap: 16px; }
  .bar-row { grid-template-columns: 1fr auto auto; }
  .bar-row .track { grid-column: 1 / -1; grid-row: 2; height: 18px; }
  .master { grid-template-columns: 1fr; }
}
@media (max-width: 400px) { .kpis { grid-template-columns: 1fr; } .tab { padding: 8px 14px; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .4s ease; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Menu utama">
    <div class="logo">
      <div class="logo-co">Cipta Harmoni Lestari</div>
      <div class="logo-app">CHL Sales<br>Admin System</div>
    </div>
    <nav class="menu" id="menu">
      <div class="grp-b solo">
        <a href="#laporan" data-v="laporan">Monitoring Laporan</a>
        <div class="sub" id="reportMenu"></div>
      </div>
    </nav>
    <div class="side-foot">
      <label class="role" for="roleSel">Masuk sebagai
        <select id="roleSel"><option value="ADMIN">Admin</option><option value="VIEWER">Viewer</option></select>
      </label>
      <p>Mockup. Data tersimpan di browser ini saja.</p>
      <button class="linkbtn" id="resetBtn" type="button">Kembalikan data contoh</button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <div class="main">
    <div class="mtop"><button class="burger" id="burger" type="button" aria-label="Buka menu" aria-controls="side" aria-expanded="false"><span></span><span></span><span></span></button><span class="mtop-t">CHL Sales Admin System</span></div>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ===================== Data & storage ===================== */
const KEY = "bast-ppn-dtp-mockup-v1";
const SEED = {
  role: "ADMIN",
  periode: [
    { id: 1, nama: "Nov-2023 s.d Des-2024", urutan: 1, aktif: true },
    { id: 2, nama: "Jan-2025 s.d Des-2025", urutan: 2, aktif: true },
    { id: 3, nama: "Jan-2026 s.d Des-2026", urutan: 3, aktif: true },
  ],
  proyek: [
    { id: 1, nama: "Naraya Serpong", urutan: 1, aktif: true },
    { id: 2, nama: "Bio District", urutan: 2, aktif: true },
    { id: 3, nama: "Mazenta Residence", urutan: 3, aktif: true },
    { id: 4, nama: "Banara Serpong", urutan: 4, aktif: true },
    { id: 5, nama: "Tanglin Parc", urutan: 5, aktif: true },
    { id: 6, nama: "Newton Springs", urutan: 6, aktif: true },
    { id: 7, nama: "Orchard Riviera", urutan: 7, aktif: true },
    { id: 8, nama: "Scotts Vale", urutan: 8, aktif: true },
  ],
  laporan: {
    "2026-11-03": [
      { periodeId: 1, proyekId: 1, d: [13, 13, 8, 8], ket: "" },
      { periodeId: 1, proyekId: 2, d: [17, 17, 0, 0], ket: "" },
      { periodeId: 2, proyekId: 3, d: [1, 1, 0, 0], ket: "" },
      { periodeId: 2, proyekId: 1, d: [0, 0, 2, 2], ket: "" },
      { periodeId: 2, proyekId: 2, d: [6, 6, 1, 2], ket: "" },
      { periodeId: 3, proyekId: 1, d: [1, 2, 0, 0], ket: "" },
      { periodeId: 3, proyekId: 4, d: [0, 1, 0, 0], ket: "" },
      { periodeId: 3, proyekId: 2, d: [2, 7, 0, 3], ket: "" },
      { periodeId: 3, proyekId: 3, d: [2, 2, 0, 0], ket: "" },
    ]
  }
};
const clone = o => JSON.parse(JSON.stringify(o));
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || clone(SEED); } catch (e) { S = clone(SEED); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
/* Tambahkan proyek baru dari data contoh ke data yang sudah tersimpan di browser */
SEED.proyek.forEach(sp => {
  if (!S.proyek.some(p => p.nama.toLowerCase() === sp.nama.toLowerCase())) {
    S.proyek.push({ id: Math.max(0, ...S.proyek.map(p => p.id)) + 1, nama: sp.nama, urutan: Math.max(0, ...S.proyek.map(p => p.urutan)) + 1, aktif: true });
  }
});
save();

/* ===================== Helpers ===================== */
const BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const ddmmyyyy = iso => iso.split("-").reverse().join("-");
const panjang = iso => { const [y, m, d] = iso.split("-"); return `${+d} ${BULAN[m - 1]} ${y}`; };
const f = n => n === 0 ? "–" : String(n);
const pct = (x, y) => y ? Math.round(x / y * 100) : 0;
const add = (a, b) => a.map((v, i) => v + b[i]);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const COLORS = ["var(--blue)", "var(--green)", "var(--gold)", "var(--navy-2)"];
const byUrut = (a, b) => a.urutan - b.urutan;
const perById = id => S.periode.find(p => p.id === id);
const prjById = id => S.proyek.find(p => p.id === id);
const dates = () => Object.keys(S.laporan).sort().reverse();
const todayISO = () => { const t = new Date(); return new Date(t - t.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
function status(b, t) {
  if (t === 0) return { t: "Tidak ada unit", c: "var(--grey)" };
  if (b >= t) return { t: "Selesai", c: "var(--green)" };
  if (b === 0) return { t: `Belum · sisa ${t}`, c: "var(--red)" };
  return { t: `Sisa ${t - b} unit`, c: "var(--gold)" };
}
const toastEl = document.getElementById("toast");
let toastT;
function toast(m) { toastEl.textContent = m; toastEl.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => toastEl.hidden = true, 2400); }

/* ===================== Hitung (sesuai PRD bagian 5) ===================== */
function hitung(tgl) {
  const rows = S.laporan[tgl] || [];
  const grand = rows.reduce((a, r) => add(a, r.d), [0, 0, 0, 0]);
  const periodes = S.periode.slice().sort(byUrut).map(p => {
    const pr = rows.filter(r => r.periodeId === p.id)
      .sort((a, b) => (prjById(a.proyekId)?.urutan ?? 99) - (prjById(b.proyekId)?.urutan ?? 99));
    return { p, rows: pr, sum: pr.reduce((a, r) => add(a, r.d), [0, 0, 0, 0]) };
  }).filter(x => x.rows.length);
  const proyeks = S.proyek.map(p => ({ p, sum: rows.filter(r => r.proyekId === p.id).reduce((a, r) => add(a, r.d), [0, 0, 0, 0]) }))
    .filter(x => x.sum[1] + x.sum[3] > 0)
    .sort((a, b) => (b.sum[1] + b.sum[3]) - (a.sum[1] + a.sum[3]));
  return { rows, grand, periodes, proyeks };
}
function teksWA(tgl) {
  const H = hitung(tgl);
  let t = `*Monitoring BAST All DTP Category*\nPerubahan Hari ini (${ddmmyyyy(tgl)})\n`;
  const g = n => n === 0 ? "-" : n;
  H.periodes.forEach(({ p, rows }) => {
    t += `\n*Periode PPN DTP (${p.nama})*\n`;
    rows.forEach(r => {
      t += `*${prjById(r.proyekId).nama.toUpperCase()}*\nBAST PPN DTP\n    Total ${g(r.d[0])} unit dari ${g(r.d[1])} unit\nBAST Non PPN DTP\n    Total ${g(r.d[2])} unit dari ${g(r.d[3])} unit\n`;
    });
  });
  return t;
}

/* ===================== Ekspor Excel ===================== */
function exportExcel(tgl) {
  if (!window.XLSX) { toast("Ekspor Excel belum siap. Periksa koneksi internet."); return; }
  const H = hitung(tgl), G = H.grand;
  const rep = [["MONITORING BAST ALL DTP CATEGORY"], [`Perubahan hari ini (${ddmmyyyy(tgl)})`], [],
    ["Proyek", "BAST PPN DTP", "Unit PPN DTP", "BAST Non PPN DTP", "Unit Non PPN DTP", "Total BAST", "Total Unit", "Status"]];
  H.periodes.forEach(({ p, rows }) => {
    rep.push([`PERIODE PPN DTP (${p.nama})`]);
    rows.forEach(r => { const b = r.d[0] + r.d[2], t = r.d[1] + r.d[3]; rep.push([prjById(r.proyekId).nama, ...r.d, b, t, status(b, t).t]); });
  });
  rep.push(["TOTAL", ...G, G[0] + G[2], G[1] + G[3], `${pct(G[0] + G[2], G[1] + G[3])}%`]);
  const data = [["Tanggal", "Periode PPN DTP", "Proyek", "BAST PPN DTP", "Total Unit PPN DTP", "BAST Non PPN DTP", "Total Unit Non PPN DTP", "Keterangan"]];
  H.rows.forEach(r => data.push([ddmmyyyy(tgl), perById(r.periodeId).nama, prjById(r.proyekId).nama, ...r.d, r.ket || ""]));
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(rep); ws1["!cols"] = [{ wch: 40 }, ...Array(7).fill({ wch: 16 })];
  const ws2 = XLSX.utils.aoa_to_sheet(data); ws2["!cols"] = [{ wch: 12 }, { wch: 24 }, { wch: 22 }, ...Array(5).fill({ wch: 18 })];
  XLSX.utils.book_append_sheet(wb, ws1, "Report");
  XLSX.utils.book_append_sheet(wb, ws2, "Data");
  XLSX.writeFile(wb, `Report_BAST_PPN_DTP_${tgl}.xlsx`);
  toast("File Excel diunduh");
}

let draft = null, draftDate = null;
function loadDraft(tgl) {
  draftDate = tgl;

function validate(rows) {
  const seen = {};
  return rows.map(r => {
    if (!r.periodeId || !r.proyekId) return "Pilih periode dan proyek";
    if (r.d.some(v => !Number.isInteger(v) || v < 0)) return "Isi angka bulat 0 atau lebih";
    if (r.d[0] > r.d[1] || r.d[2] > r.d[3]) return "BAST melebihi total";
    const k = r.periodeId + "-" + r.proyekId;
    if (seen[k]) return "Periode dan proyek ini sudah ada di baris lain";
    seen[k] = 1; return "";
  });
}

  document.getElementById("addRow").onclick = () => { draft.push({ periodeId: null, proyekId: null, d: [0, 0, 0, 0], ket: "" }); render(); };

function bindMaster() {
  const v = document.getElementById("view");
  const find = s => { const [k, id] = s.split(":"); return S[k].find(p => p.id === +id); };
  v.querySelectorAll("[data-name]").forEach(inp => inp.onchange = () => {
    const nm = inp.value.trim(), [k] = inp.dataset.name.split(":"), it = find(inp.dataset.name);
    if (!nm) { inp.value = it.nama; toast("Nama tidak boleh kosong"); return; }
    if (S[k].some(p => p !== it && p.nama.toLowerCase() === nm.toLowerCase())) { inp.value = it.nama; toast("Nama sudah dipakai"); return; }
    it.nama = nm; save(); toast("Nama disimpan");
  });
  v.querySelectorAll("[data-aktif]").forEach(c => c.onchange = () => { find(c.dataset.aktif).aktif = c.checked; save(); toast(c.checked ? "Diaktifkan" : "Dinonaktifkan"); });
  v.querySelectorAll("[data-up]").forEach(b => b.onclick = () => {
    const [k] = b.dataset.up.split(":"), it = find(b.dataset.up), items = S[k].slice().sort(byUrut), i = items.indexOf(it);
    const o = items[i - 1]; [it.urutan, o.urutan] = [o.urutan, it.urutan]; save(); render();
  });
  v.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const k = b.dataset.add, inp = document.getElementById("new-" + k), nm = inp.value.trim();
    if (!nm) { toast("Isi nama terlebih dahulu"); return; }
    if (S[k].some(p => p.nama.toLowerCase() === nm.toLowerCase())) { toast("Nama sudah dipakai"); return; }
    const id = Math.max(0, ...S[k].map(p => p.id)) + 1, ur = Math.max(0, ...S[k].map(p => p.urutan)) + 1;
    S[k].push({ id, nama: nm, urutan: ur, aktif: true }); save(); render(); toast(`${nm} ditambahkan`);
  });
}

  { grup: "PT. Bhakti Bangun Harmoni – The Sanctuary Collection", proyek: "Mozenta Residence", h: [0, 0], b: [0, 0], y: [3, 7.24], a: [88, 244.61], t: [91, 259.00] },
  { grup: "Proyek Lainnya", proyek: "Marchand Hype Station", h: [0, 0], b: [0, 0], y: [0, 0], a: [189, 103.70], t: [266, 178.00] },
] } };
if (!S.sales) S.sales = clone(SALES_SEED);
const KOLOM = ["h", "b", "y", "a", "t"];
const rp = v => "Rp" + v.toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " M";
const rpN = v => v === 0 ? "–" : v.toLocaleString("id-ID", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uN = v => v === 0 ? "–" : v.toLocaleString("id-ID");
const salesDates = () => Object.keys(S.sales.laporan).sort().reverse();
const bulanTahun = iso => { const [y, m] = iso.split("-"); return `${BULAN[m - 1]} ${y}`; };
function sumSales(rows) {
  const z = {}; KOLOM.forEach(k => z[k] = [0, 0]);
  rows.forEach(r => KOLOM.forEach(k => { z[k][0] += r[k][0]; z[k][1] += r[k][1]; }));
  KOLOM.forEach(k => z[k][1] = Math.round(z[k][1] * 100) / 100);
  return z;
}
function groupsOf(rows) {
  const g = [];
  rows.forEach(r => { let x = g.find(x => x.nama === r.grup); if (!x) g.push(x = { nama: r.grup, rows: [] }); x.rows.push(r); });
  return g;
}
let salesSel = salesDates()[0];
function viewSales() {
  const ds = salesDates();
  if (!ds.length) return `<div class="page gut"><div class="empty">Belum ada laporan penjualan.</div></div>`;
  if (!ds.includes(salesSel)) salesSel = ds[0];
  const rows = S.sales.laporan[salesSel], T = sumSales(rows), bln = bulanTahun(salesSel), thn = salesSel.slice(0, 4);
  const kpi = (c, lbl, u, v, note) => `<div class="kpi" style="--c:${c}"><div class="lbl">${lbl}</div>
    <div class="val num">${u.toLocaleString("id-ID")} <small>unit</small></div><div class="pct num">${rp(v)}</div><div class="note">${note}</div></div>`;
  const contrib = (k, judul) => {
    const list = rows.filter(r => r[k][0] > 0 || r[k][1] > 0).sort((a, b) => b[k][1] - a[k][1]);
    const max = Math.max(0, ...list.map(r => r[k][1]));
    const nihil = rows.length - list.length;
    return `<section class="gut"><h2>${judul}</h2>
      <div class="desc">${list.length ? `${list.length} proyek melakukan penjualan; ${nihil} proyek lainnya nihil. Panjang batang = nilai penjualan.` : "Tidak ada penjualan pada periode ini."}</div>
      <div class="bars">${list.map((r, i) => `<div class="bar-row"><span class="nm">${esc(r.proyek)}</span>
        <div class="track"><div class="fill" style="--c:${COLORS[i % 4]};width:${max ? r[k][1] / max * 100 : 0}%"></div></div>
        <span class="u num">${r[k][0]} unit</span><span class="p num">${rp(r[k][1])}</span></div>`).join("")}</div></section>`;
  };
  let tbl = `<thead><tr><th rowspan="2" style="text-align:center;width:26%">Proyek</th><th colspan="2">${esc(bln)}</th><th colspan="2">YTD ${esc(BULAN[+salesSel.slice(5, 7) - 1])}</th><th colspan="2">Akumulasi terjual</th></tr>
    <tr><th>Unit</th><th>Rp M</th><th>Unit</th><th>Rp M</th><th>Unit</th><th>Rp M</th></tr></thead><tbody>`;
  groupsOf(rows).forEach((g, i) => {
    tbl += `<tr class="group" style="--gc:${COLORS[i % 4]}"><td colspan="7">${esc(g.nama)}</td></tr>`;
    g.rows.forEach(r => tbl += `<tr><td class="proj">${esc(r.proyek)}</td><td>${uN(r.b[0])}</td><td>${rpN(r.b[1])}</td><td>${uN(r.y[0])}</td><td>${rpN(r.y[1])}</td>
      <td class="tot">${uN(r.a[0])}<small>dari ${r.t[0].toLocaleString("id-ID")}</small></td><td class="tot">${rpN(r.a[1])}<small>dari ${rpN(r.t[1])}</small></td></tr>`);
  });
  tbl += `<tr class="grand"><td class="proj">Total CHL</td><td>${T.b[0]}</td><td>${rpN(T.b[1])}</td><td>${T.y[0]}</td><td>${rpN(T.y[1])}</td>
    <td>${T.a[0].toLocaleString("id-ID")}<small>dari ${T.t[0].toLocaleString("id-ID")}</small></td><td>${rpN(T.a[1])}<small>dari ${rpN(T.t[1])}</small></td></tr></tbody>`;
  const notes = [];
  if (T.h[0] === 0) notes.push(`Tidak ada penjualan pada ${panjang(salesSel)}.`);
  const sisa = rows.filter(r => r.t[0] - r.a[0] > 0).sort((a, b) => (b.t[0] - b.a[0]) - (a.t[0] - a.a[0]))[0];
  if (sisa) notes.push(`Stok belum terjual terbanyak: <b>${esc(sisa.proyek)}</b>, ${sisa.t[0] - sisa.a[0]} unit dari ${sisa.t[0]} unit.`);
  const nihilYtd = rows.filter(r => r.y[0] === 0).map(r => esc(r.proyek));
  if (nihilYtd.length) notes.push(`Belum ada penjualan sepanjang ${thn}: <b>${nihilYtd.join(", ")}</b>.`);
  return `<div class="page">
  <div class="hero">
    <div class="tabs"><span class="tab">Sales Performance</span><span class="tab">${panjang(salesSel)}</span></div>
    <div class="hero-body gut"><h1>Dashboard Penjualan Properti</h1><div class="sub">${esc(bln)} • YTD ${esc(bln)} • Total terjual</div></div>
    <div class="strip gut"><span>Data penjualan ${rows.length} proyek${T.h[0] === 0 ? ` • Tidak ada perubahan pada ${panjang(salesSel)}` : ""}</span>
      <div class="strip-actions">
        <label for="salesDate" style="font-size:13px">Tanggal</label>
        <select id="salesDate">${ds.map(d => `<option value="${d}" ${d === salesSel ? "selected" : ""}>${ddmmyyyy(d)}</option>`).join("")}</select>
        <button class="btn-ghost" id="salesCopy" type="button">Salin teks laporan</button>
        <button class="btn-ghost" id="salesXls" type="button">Ekspor Excel</button>
      </div></div>
  </div>
  <div class="kpis gut">
    ${kpi("var(--gold)", "Laporan hari ini", T.h[0], T.h[1], `Penjualan ${panjang(salesSel)}`)}
    ${kpi("var(--blue)", `Bulan ${esc(bln)}`, T.b[0], T.b[1], `Penjualan selama ${esc(BULAN[+salesSel.slice(5, 7) - 1])}`)}
    ${kpi("var(--green)", `YTD s.d. ${esc(BULAN[+salesSel.slice(5, 7) - 1])}`, T.y[0], T.y[1], `Penjualan Januari–${esc(BULAN[+salesSel.slice(5, 7) - 1])} ${thn}`)}
    ${kpi("var(--gold)", "Akumulasi total terjual", T.a[0], T.a[1], `Dari ${T.t[0].toLocaleString("id-ID")} unit • ${pct(T.a[0], T.t[0])}% terjual`)}
  </div>
  ${contrib("h", "Kontributor Penjualan Hari Ini")}
  ${contrib("b", `Kontributor Penjualan ${esc(bln)}`)}
  <section><div class="gut"><h2>Penjualan per Proyek</h2><div class="desc">Unit dan nilai penjualan (Rp miliar). Akumulasi dihitung sejak awal pemasaran.</div></div>
    <div class="tbl-wrap"><table class="rincian num">${tbl}</table></div></section>
  <div class="notes gut"><h2>Catatan Penting</h2><ul>${notes.map(n => `<li>${n}</li>`).join("")}</ul></div>
  </div>`;
}
function salesText(tgl) {
  const rows = S.sales.laporan[tgl], T = sumSales(rows), bln = bulanTahun(tgl);
  let t = `*Dashboard Penjualan Properti*\n${panjang(tgl)}\n\n`;
  t += `Hari ini: ${T.h[0]} unit (${rp(T.h[1])})\nBulan ${bln}: ${T.b[0]} unit (${rp(T.b[1])})\nYTD: ${T.y[0]} unit (${rp(T.y[1])})\nAkumulasi terjual: ${T.a[0]} dari ${T.t[0]} unit (${rp(T.a[1])})\n`;
  const kontr = rows.filter(r => r.b[0] > 0).sort((a, b) => b.b[1] - a.b[1]);
  if (kontr.length) { t += `\n*Kontributor ${bln}*\n`; kontr.forEach(r => t += `${r.proyek}: ${r.b[0]} unit, ${rp(r.b[1])}\n`); }
  return t;
}
function bindSales() {
  const sel = document.getElementById("salesDate");
  if (!sel) return;
  sel.onchange = () => { salesSel = sel.value; render(); };
  document.getElementById("salesCopy").onclick = () => {
    const txt = salesText(salesSel);
    navigator.clipboard.writeText(txt).then(() => toast("Teks laporan disalin")).catch(() => toast("Gagal menyalin. Coba lagi."));
  };
  document.getElementById("salesXls").onclick = () => {
    if (!window.XLSX) { toast("Ekspor Excel belum siap. Periksa koneksi internet."); return; }
    const rows = S.sales.laporan[salesSel], T = sumSales(rows);
    const aoa = [["DASHBOARD PENJUALAN PROPERTI"], [panjang(salesSel)], [],
      ["Grup", "Proyek", "Hari ini unit", "Hari ini Rp M", "Bulan unit", "Bulan Rp M", "YTD unit", "YTD Rp M", "Terjual unit", "Terjual Rp M", "Total unit", "Total Rp M"]];
    rows.forEach(r => aoa.push([r.grup, r.proyek, ...KOLOM.flatMap(k => r[k])]));
    aoa.push(["", "TOTAL CHL", ...KOLOM.flatMap(k => T[k])]);
    const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{ wch: 36 }, { wch: 24 }, ...Array(10).fill({ wch: 13 })];
    XLSX.utils.book_append_sheet(wb, ws, "Penjualan");
    XLSX.writeFile(wb, `Dashboard_Penjualan_${salesSel}.xlsx`);

}

/* Input penjualan */
let sDraft = null, sDraftDate = null;
function sLoad(tgl) { sDraftDate = tgl; sDraft = clone(S.sales.laporan[tgl] || []); }
function sValidate(rows) {
  const seen = {};
  return rows.map(r => {
    if (!r.grup.trim() || !r.proyek.trim()) return "Isi grup dan nama proyek";
    if (KOLOM.some(k => r[k].some(v => !Number.isFinite(v) || v < 0)) || KOLOM.some(k => !Number.isInteger(r[k][0]))) return "Unit harus bilangan bulat, Rp harus angka 0 atau lebih";
    if (r.h[0] > r.b[0] || r.b[0] > r.y[0]) return "Unit hari ini ≤ bulan ini ≤ YTD";
    if (r.a[0] > r.t[0]) return "Unit terjual melebihi total stok";
    const k = r.proyek.trim().toLowerCase();
    if (seen[k]) return "Proyek ini sudah ada di baris lain";
    seen[k] = 1; return "";
  });
}
const SKOL = [["h", "Hari ini"], ["b", "Bulan ini"], ["y", "YTD"], ["a", "Akumulasi terjual"], ["t", "Total stok"]];
function viewSalesInput() {
  if (sDraft === null) sLoad(salesDates()[0] || todayISO());
  const errs = sValidate(sDraft), hasErr = errs.some(Boolean);
  const prev = salesDates().filter(d => d < sDraftDate)[0];
  const body = sDraft.map((r, i) => `<tr class="${errs[i] ? "err" : ""}">
    <td><input type="text" id="sg-${i}" data-i="${i}" data-f="grup" value="${esc(r.grup)}" aria-label="Grup baris ${i + 1}">${errs[i] ? `<div class="msg">${errs[i]}</div>` : ""}</td>
    <td><input type="text" id="sp-${i}" data-i="${i}" data-f="proyek" value="${esc(r.proyek)}" aria-label="Proyek baris ${i + 1}"></td>
    ${SKOL.map(([k]) => `<td><input type="number" min="0" step="1" id="s${k}0-${i}" data-i="${i}" data-k="${k}" data-j="0" value="${r[k][0]}" aria-label="${k} unit baris ${i + 1}"></td>
      <td><input type="number" min="0" step="0.01" id="s${k}1-${i}" data-i="${i}" data-k="${k}" data-j="1" value="${r[k][1]}" aria-label="${k} Rp baris ${i + 1}"></td>`).join("")}
    <td><button class="del" data-sdel="${i}" type="button" aria-label="Hapus baris ${i + 1}">×</button></td></tr>`).join("");
  return `<div class="page gut">
  <div class="form-head"><div><h2>Input Data Penjualan</h2><div class="desc">Satu baris per proyek. Nilai Rp dalam miliar, contoh 12,45 ditulis 12.45.</div></div></div>
  <div class="form-head">
    <label class="field" for="sTgl">Tanggal laporan<input id="sTgl" type="date" value="${sDraftDate}"></label>
    <div class="btn-row">
      ${prev && !sDraft.length ? `<button class="btn sec" id="sCopyPrev" type="button">Salin dari laporan ${ddmmyyyy(prev)}</button>` : ""}
      <button class="btn sec" id="sAdd" type="button">Tambah proyek</button>
      <button class="btn" id="sSave" type="button" ${hasErr || !sDraft.length ? "disabled" : ""}>Simpan laporan</button>
    </div>
  </div>
  ${sDraft.length ? `<div class="tbl-wrap"><table class="edit num" style="min-width:1280px"><thead>
    <tr><th rowspan="2">Grup</th><th rowspan="2">Proyek</th>${SKOL.map(([, l]) => `<th colspan="2">${l}</th>`).join("")}<th rowspan="2"></th></tr>
    <tr>${SKOL.map(() => "<th>Unit</th><th>Rp M</th>").join("")}</tr></thead><tbody>${body}</tbody></table></div>`
    : `<div class="empty">Belum ada data untuk ${ddmmyyyy(sDraftDate)}. ${prev ? `Salin dari laporan ${ddmmyyyy(prev)} atau tambah proyek.` : "Tambah proyek untuk mulai mengisi."}</div>`}
  <p class="hint">${hasErr ? "Perbaiki baris bertanda merah sebelum menyimpan." : S.sales.laporan[sDraftDate] ? "Menyimpan akan mengganti laporan tanggal ini." : "Laporan baru untuk tanggal ini."}</p></div>`;
}
function bindSalesInput() {
  const v = document.getElementById("view");
  document.getElementById("sTgl").onchange = e => { if (e.target.value) { sLoad(e.target.value); render(); } };
  const cp = document.getElementById("sCopyPrev");
  if (cp) cp.onclick = () => {
    const prev = salesDates().filter(d => d < sDraftDate)[0];
    sDraft = clone(S.sales.laporan[prev]).map(r => ({ ...r, h: [0, 0] }));
    render(); toast(`Data ${ddmmyyyy(prev)} disalin, kolom hari ini dikosongkan.`);
  };
  document.getElementById("sAdd").onclick = () => { sDraft.push({ grup: sDraft.at(-1)?.grup || "", proyek: "", h: [0, 0], b: [0, 0], y: [0, 0], a: [0, 0], t: [0, 0] }); render(); };
  document.getElementById("sSave").onclick = () => {
    S.sales.laporan[sDraftDate] = clone(sDraft).map(r => ({ ...r, grup: r.grup.trim(), proyek: r.proyek.trim() }));
    save(); salesSel = sDraftDate; toast(`Laporan ${ddmmyyyy(sDraftDate)} tersimpan`); render();
  };
  v.querySelectorAll("[data-sdel]").forEach(b => b.onclick = () => { sDraft.splice(+b.dataset.sdel, 1); render(); });
  v.querySelectorAll("input[data-f]").forEach(inp => inp.onchange = () => { sDraft[+inp.dataset.i][inp.dataset.f] = inp.value; render(inp.id); });
  v.querySelectorAll("input[data-k]").forEach(inp => inp.onchange = () => {
    const raw = inp.value.trim().replace(",", ".");
    sDraft[+inp.dataset.i][inp.dataset.k][+inp.dataset.j] = raw === "" ? 0 : Number(raw); render(inp.id);
  });
}

/* ===================== Daftar report (tambah report baru di sini) ===================== */
const REPORTS = [
  { id: "bast", nama: "Dashboard Monitoring BAST All DTP Category", menu: "DASHBOARD MONITORING BAST ALL DTP CATEGORY", desc: "Progres BAST unit PPN DTP dan Non PPN DTP per periode dan proyek.",
    tabs: [
      { id: "bast", label: "Dashboard", view: viewDashboard, bind: bindDashboard },
      { id: "bast-input", label: "Input Data", view: viewInput, bind: bindInput, admin: true },
      { id: "bast-master", label: "Master", view: viewMaster, bind: bindMaster, admin: true },
    ],
    meta: () => { const d = dates()[0]; if (!d) return "Belum ada laporan"; const G = hitung(d).grand; return `Laporan ${ddmmyyyy(d)} · ${G[0] + G[2]} / ${G[1] + G[3]} unit BAST`; } },
  { id: "penjualan", nama: "Dashboard Penjualan Properti", menu: "DASHBOARD PENJUALAN PROPERTI", desc: "Unit dan nilai penjualan per proyek: hari ini, bulan berjalan, YTD, dan akumulasi terjual.",
    tabs: [
      { id: "penjualan", label: "Dashboard", view: viewSales, bind: bindSales },
      { id: "penjualan-input", label: "Input Data", view: viewSalesInput, bind: bindSalesInput, admin: true },
    ],
    meta: () => { const d = salesDates()[0]; if (!d) return "Belum ada laporan"; const T = sumSales(S.sales.laporan[d]); return `Laporan ${ddmmyyyy(d)} · ${T.b[0]} unit bulan ini · ${rp(T.b[1])}`; } },
];
function viewLaporan() {
  return `<div class="page gut"><div class="rhead"><div><h2>Monitoring Laporan</h2>
    <div class="desc">Pilih report untuk melihat dashboard atau mengisi data.</div></div></div>
    <div class="cards">${REPORTS.map(r => `<a class="rcard" href="#${r.id}"><h3>${esc(r.nama)}</h3><p>${esc(r.desc)}</p><span class="meta">${esc(r.meta())}</span></a>`).join("")}
      <div class="rcard soon"><h3>Report lainnya</h3><p>Report berikutnya akan muncul di sini dengan format yang sama: dashboard, input data, dan master.</p></div></div></div>`;
}
function reportFrame(r, tab, inner) {
  const tabs = r.tabs.filter(t => !t.admin || S.role === "ADMIN");
  return `<div class="page gut"><div class="rhead"><div><div class="crumb"><a href="#laporan">Monitoring Laporan</a> / ${esc(r.nama)}</div><h2>${esc(r.nama)}</h2></div></div>
    <nav class="rtabs" aria-label="Bagian report">${tabs.map(t => `<a href="#${t.id}" class="${t.id === tab.id ? "on" : ""}" ${t.id === tab.id ? 'aria-current="page"' : ""}>${t.label}</a>`).join("")}</nav></div>${inner}`;
}
function findTab(v) { for (const r of REPORTS) for (const t of r.tabs) if (t.id === v) return { r, t }; return null; }

/* ===================== Router ===================== */
function current() {
  let v = location.hash.slice(1);
  if (v === "dashboard") v = "bast"; else if (v === "input") v = "bast-input"; else if (v === "master") v = "bast-master";
  if (!(v === "laporan" || findTab(v))) v = "laporan";
  const ft = findTab(v);
  if (ft && ft.t.admin && S.role !== "ADMIN") { v = ft.r.tabs[0].id; history.replaceState(null, "", "#" + v); }
  return v;
}
function renderMenu(v) {
  const ft = findTab(v);
  document.getElementById("reportMenu").innerHTML = REPORTS.map(r =>
    `<a href="#${r.tabs[0].id}" class="${ft && ft.r === r ? "cur" : ""}">${esc(r.menu || r.nama)}</a>`).join("");
  document.querySelectorAll("#menu .grp-b > a").forEach(a => {
    const on = a.dataset.v === v || (a.dataset.v === "laporan" && (v === "laporan" || ft));
    a.classList.toggle("on", !!on); if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}
let rendering = false;
function render(focusId) {
  if (rendering) return;
  rendering = true;
  const v = current();
  try {
    const view = document.getElementById("view"), ft = findTab(v);
    if (ft) { view.innerHTML = reportFrame(ft.r, ft.t, ft.t.view()); ft.t.bind(); }
    else view.innerHTML = viewLaporan();
    renderMenu(v);
  } finally { rendering = false; }
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus(); }
}

/* Sidebar: grup lipat dan menu ponsel */
const side = document.getElementById("side"), scrim = document.getElementById("scrim"), burger = document.getElementById("burger");
function setMenu(open) { side.classList.toggle("open", open); scrim.hidden = !open; burger.setAttribute("aria-expanded", String(open)); }
burger.onclick = () => setMenu(!side.classList.contains("open"));
scrim.onclick = () => setMenu(false);
side.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });

const roleSel = document.getElementById("roleSel");
roleSel.value = S.role;
roleSel.onchange = () => { S.role = roleSel.value; save(); render(); toast(`Masuk sebagai ${S.role === "ADMIN" ? "Admin" : "Viewer"}`); };
document.getElementById("resetBtn").onclick = () => {
  const role = S.role; S = clone(SEED); S.role = role; S.sales = clone(SALES_SEED); save(); draft = null; sDraft = null; selDate = dates()[0]; salesSel = salesDates()[0]; render(); toast("Data contoh dikembalikan");
};
window.addEventListener("hashchange", () => { if (current() === "bast-input" && draft === null) loadDraft(dates()[0] || todayISO()); if (current() === "penjualan-input" && sDraft === null) sLoad(salesDates()[0] || todayISO()); render(); window.scrollTo(0, 0); });
if (!location.hash) history.replaceState(null, "", "#bast");
render();
</script>
